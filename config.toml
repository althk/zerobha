# Zerobha Trading Bot Configuration

# Strategy to run: orb | gapfade (both intraday/MIS), or dailyrev (backtest only)
strategy = "orb"
uptrend_only = false
# Paper trading: real market data and real quotes, simulated fills against
# virtual capital. The paper broker holds the stop and target itself, so
# positions exit on the same rules they would live. Also settable with -paper.
# Note the usual convention here: paper_capital = 0 means "absent" and gets
# the default below, not a zero-capital account.
paper_trading = false
paper_capital = 1000000.0

# Zerodha API Credentials.
# These are bare keys: they MUST stay above the first [section] header, or TOML
# assigns them to that section and the config fails to load.
api_key = ""
api_secret = ""

# Upstox read-only access token, used only by the gapfade news/earnings gate.
# Long-lived (~1 year) and unrelated to the Kite credentials above. Bare key —
# same placement rule.
upstox_access_token = ""

[paths]
# Where the trader writes. Both are relative to the working directory: the repo
# root for a local run, /app in the container. Missing directories are created.
#
# The two destinations are independent because they land on different Docker
# volumes. In the container set:
#
#   db_path = "data/zerobha.db"   -> /app/data, the data volume
#   log_dir = "logs"              -> /app/logs, the logs volume
#
# Keep them apart. A single WORKDIR pointing at the data volume would resolve a
# relative log_dir inside it, and the backup — which reads the logs volume —
# would silently find nothing to upload.
db_path = "zerobha.db"
log_dir = "logs"

[risk]
max_daily_loss       = 5000   # INR; kill switch triggers when daily PnL drops below -max_daily_loss
max_trades_per_day   = 10     # total signals executed across all symbols
max_trades_per_stock = 0      # 0 = disabled; ORB's one_trade_per_day already caps per-symbol entries

[engine]
min_balance          = 3000   # INR; skip all signals when available balance is below this
min_capital_per_trade = 30000 # INR floor allocated per open slot
max_capital_per_trade = 50000 # INR cap allocated per open slot
trade_cutoff_min     = 845    # minutes from midnight (845 = 14:05); no new signals after this time

[orb]
timeframe = "5m"
csv_file = "high_beta_stocks.csv"
limit = 50

# Entry window cutoff in minutes from midnight (default: 630 = 10:30 AM IST)
entry_window_end = 630

# RSI thresholds for long/short entries
rsi_long_threshold = 50.0
rsi_short_threshold = 40.0

# ADX threshold for trend confirmation
adx_threshold = 20.0

# Opening range size filter (as ATR multiples)
min_range_atr = 1.0
max_range_atr = 3.0

# Stop-loss and target as ATR multiples
sl_multiplier = 1.5
target_multiplier = 3.0

# Max simultaneous open positions
max_concurrent = 5


# --- GapFade: buy the intraday recovery in an unexplained gap down (MIS) ---
[gapfade]
timeframe = "5m"
csv_file = "ind_nifty200list.csv"
limit = 200

# Qualifying gap band, percent below the previous close. Gaps beyond the max
# are usually corporate actions (split/bonus), not panics.
min_gap_down_pct = 5.0
max_gap_down_pct = 20.0

# "Let the knife land" window, then the window in which a reclaim may trigger.
# Minutes from midnight IST: 570 = 09:30, 660 = 11:00.
observe_end_min = 570
entry_window_end = 660

# Stop is sl_atr x ATR below entry, floored at the session low; target is
# reward_risk x the realised stop distance (1:2). An entry whose stop would sit
# further than max_stop_pct below entry is skipped.
atr_period = 14
sl_atr = 2.0
reward_risk = 2.0
max_stop_pct = 5.0
stop_at_day_low = true
require_above_vwap = true
min_price = 50

max_concurrent = 5

# What to do when the Upstox gate errors (network, expired token). false = skip
# the trade: an unverified gap fade is a different strategy than this one.
gate_fail_open = false

# --- Policy for the Upstox news/earnings gate (credential is the top-level
# --- upstox_access_token key above) ---
[upstox]
# Any NSE constituent CSV with "Symbol" and "ISIN Code" columns. Upstox keys
# both news and fundamentals by ISIN.
isin_csv = "ind_nifty500list.csv"

# How far back a headline still counts as an explanation for today's gap.
news_lookback_hours = 48

# Blocks when the latest reported quarter's net profit fell more than this
# (year-on-year where four quarters of history exist).
max_profit_drop_pct = 25.0

# Beyond this age the latest reported quarter is treated as stale and the entry
# rests on the news check alone.
max_results_age_days = 180

timeout_seconds = 5

# Extra headline keywords that block a fade. Empty = the built-in list in
# pkg/upstox/gate.go (fraud, probe, SEBI, resignation, downgrade, default, ...).
block_keywords = []

# Donchian intraday channel breakout on the NIFTY / SENSEX 5-minute INDEX
# chart, executed in weekly index options.
#
# The signal instrument and the traded instrument are deliberately different:
# the index says when to act, an option is what gets bought. cmd/backtest
# trades the index directly (that is what every recorded result measures);
# cmd/trader translates each signal into a contract. See CLAUDE.md.
[donchian]
timeframe = "5m"
# Backtest universe: a CSV listing the index symbols to replay, matching files
# in test/data/<timeframe>/ (nifty50_real.csv, sensex_real.csv from cmd/idxdl).
csv_file = "indices.csv"
limit = 2

# Channel over the last N completed bars, excluding the bar being evaluated.
# The close must clear it by breakout_buffer_points to count as a break.
#
# NOTE breakout_buffer_points is an ABSOLUTE points knob, so the same value
# means different things across instruments: 2 points is 0.11 ATR on NIFTY but
# 0.03 ATR on SENSEX. Set it per index rather than sharing one run.
donchian_lookback = 30
breakout_buffer_points = 2.0
atr_period = 9

use_ignition = true
ignition_atr_mult = 1.0
# Index 5-minute ATR runs 0.076-0.083% of price. The stock-sized 0.15 floor
# rejected every single bar.
min_atr_pct = 0.03

# Initial stop, then a chandelier trail from the best price reached since entry.
# The trail is the ONLY profit-taking exit: a target and BREAKEVEN+ were each
# measured repeatedly and each cost more than it saved, so both knobs are gone.
#
# sl_atr_mult was 1.3, which stopped out 82% of trades before the move
# developed while all of the profit sat in the ones that survived to run.
#
# trail_atr_mult swept 1.5-8.0 on a matched entry list (2026-08-27): tightening
# it is destructive (1.5 costs 61% of per-trade edge and takes the held-out year
# to zero), and 2.5-6.0 is a flat plateau. 3.5 tops every aggregate but the two
# indices swap places under it out of sample, so 3.0 stands.
#
# An explicit trail_atr_mult = 0 disables the trail and leaves the initial stop.
# The field is a pointer so that zero survives; as a float64 it was replaced by
# the default and the trail-free case could not be measured at all.
sl_atr_mult = 3.0
trail_atr_mult = 3.0

# Overrides [engine].max_capital_per_trade for this strategy only.
#
# The engine's cap is sized for cash equities. An index priced above it is not
# traded smaller, it is not traded AT ALL: quantity floors to zero and every
# signal vanishes, which reads as the strategy finding no setups. SENSEX at
# ~78,000 against the stock-sized 50,000 produced exactly zero trades. Raising
# the engine's cap instead would rescale ORB and gapfade, whose recorded
# results were all measured at the stock-sized value.
#
# Keep it well under the 5L the backtester funds an account with: above that,
# SimBroker refuses longs for insufficient cash and a long/short strategy
# quietly becomes short-only.
max_capital_per_trade = 450000

# --- Option execution (live only; cmd/backtest trades the index directly) ---
#
# target_delta is what gets bought to express a signal: a call for a long view,
# a put for a short. Never a sold option.
#
# A delta target is not the same as a fixed point offset. What sets delta is the
# move in units of sigma*sqrt(T), so 150 points ITM is ~0.95 delta on expiry
# morning and ~0.68 six days out.
target_delta = 0.80
# Higher delta target closer to expiry (DTE <= 3) to reduce extrinsic time value and theta bleed
target_delta_near_expiry = 0.90

# min_days_to_expiry is the most valuable knob here. As time to expiry
# collapses, the target-delta strike walks in towards spot, so on expiry day it
# buys a nearly worthless contract with enormous leverage and brutal decay per
# rupee of premium: -1571 bps per trade against -104 to +106 for the rest of
# the week. 2 skips expiry day and the day before.
#
# 0 is a meaningful value ("trade expiry day too"), so the field is a pointer
# and an explicit 0 here survives rather than being replaced by the default.
min_days_to_expiry = 2

# Optional ADX trend filter, rejecting breakouts that fire in sideways chop.
# 0 disables it. These are the measured best of a 32-cell period x threshold
# sweep (2026-08-27, 733 sessions, both indices).
#
# The value of the filter is NOT a better per-trade edge - out of sample the
# whole grid, filter off included, sits between +1.1 and +2.2 bps. It is that
# 14/15 takes 95 FEWER trades than no filter and still produces more total
# gross (+6,292 vs +6,215 bps), so the entries it removes were net-negative
# contributors paying full brokerage.
#
# Keep it mild. Tightening the gate raises the tuning window and destroys the
# held-out year: period 7 threshold 40 reads +8.91 bps in sample and -0.03 out.
adx_threshold = 15.0
adx_period = 14

# Volatility used only when the at-the-money premium cannot be read. 0 means
# "refuse to trade": picking a strike against a stale constant silently buys
# the wrong contract, and not trading is the better failure.
fallback_iv = 0.0

# Minutes from midnight IST: 570 = 09:30, 871 = 14:31, 897 = 14:57.
entry_start_min = 570
entry_cutoff_min = 871
squareoff_min = 897

risk_pct = 0.5
max_daily_loss_pct = 2.0
max_concurrent = 5
max_entries_per_symbol = 4

allow_short = true
exit_on_opposite_break = true

[srlevels]
# Intraday support/resistance on the index charts, for weekly-option execution:
# a break of a level buys the PE, a bounce off it buys the CE, and the
# resistance cases mirror both. Backtest-only for now — cmd/trader has no case
# for this strategy.
timeframe = "5m"
# NIFTY only. SENSEX was measured alongside and gave 29 priceable option trades
# against NIFTY's 80 - too few to read, and its held-out window disagreed in
# sign, which is one flat result sampled twice rather than two markets speaking.
csv_file = "nifty.csv"
limit = 1

# Levels come from the PREVIOUS session's high/low/close. "traditional" is the
# floor-trader formula and "fibonacci" places the bands at 0.382/0.618/1.000 of
# the previous range. Traditional wins on every comparable cell of the sweep;
# every fibonacci cell measured negative.
pivot_method = "traditional"
atr_period = 9

# Every distance here is in ATR, never points: an absolute buffer is not
# comparable across NIFTY (~24,000) and SENSEX (~78,000).
#   break_buffer_atr — how far past the level the close must be to confirm
#   touch_atr        — how close the wick must come for a bounce/rejection
#   proximity_atr    — radius around the close inside which a level is in play
break_buffer_atr = 0.10
touch_atr = 0.25
proximity_atr = 1.0

# The higher-timeframe gate. It is the only thing keeping this signal above
# zero: switching it off multiplies entries ~6x and takes gross to -1.34 bps at
# t = -1.91. It also cuts the sample to ~0.16 trades a session, which is the
# strategy's real problem — see the srlevels section of CLAUDE.md.
use_htf_confirm = true
htf_lookback_days = 20
swing_strength = 2
zone_width_pct = 0.15
min_zone_touches = 1
# Room to the next opposing zone. Measured INERT: 0, 1 and 2 ATR agree within a
# quarter of a standard error. Shipped at 0 so this config reproduces the trade
# list every recorded srlevels figure was measured on - a gate that does nothing
# should not also make the numbers unreproducible.
min_room_atr = 0.0

# Index 5-minute ATR runs 0.076-0.083% of price; the stock-sized 0.15 floor
# rejects every bar.
min_atr_pct = 0.03

# Exits: a far target plus a loose chandelier trail. Both are deliberately
# loose - every tight version of either measured decisively worse.
#
# The target does NOT change which trades win. On a matched 120-trade entry list
# the win rate is 36.7% and the stop-out count is exactly 72 at every setting
# from 4 ATR out; what moves is the right tail. A 3 ATR target caps the largest
# winner at 72 bps against 112 bps everywhere else and costs 2.6 of the 3.9 bps
# available - pure amputation, the same "win rate unchanged, expectancy gone"
# signature CLAUDE.md records for ORB's TP 5 -> 4.
#
#   TP   bind   bps   OOS      TP   bind   bps   OOS
#    3   35/120 1.19  1.75      8    5/120 3.78  4.03
#    4   23/120 2.54  3.82     10    2/120 3.68  3.79
#    6   10/120 3.41  4.39   none        - 3.53  3.79
#
# 6 over 8 on BIND RATE, not on the point estimate: 8 fires on 5 of 120 trades,
# which is the no-target case wearing a target, while 6 fires on 10-11 and
# actually caps the risk of running to the 14:57 bell. 6 also wins out of sample.
#
# The trail was swept 1.5-4.0 on a matched entry list: 1.5 and 2.0 are
# DECISIVELY NEGATIVE (-2.0 to -2.8 bps, t = -2.0) on every stop row and in both
# windows; 2.5 is roughly zero; 3.0 recovers to +3.5; no trail is +3.9.
#
# The stop does NOT replicate: 2.5 tops the small sample and is among the worst
# on the large one. 1.5 is the value that is positive on both.
#
# All three are pointers: 0 is a real setting for each, and with a plain float a
# non-zero default would silently win. That trap has bitten this repo twice.
sl_atr_mult = 1.5
tp_atr_mult = 6.0
trail_atr_mult = 3.0

entry_start_min = 570
entry_cutoff_min = 871
squareoff_min = 897

# The engine's cap is stock-sized; an index priced above it floors quantity to
# zero and produces no trades at all rather than smaller ones.
max_capital_per_trade = 150000
risk_pct = 0.5
max_daily_loss_pct = 2.0
max_concurrent = 5
# ONE entry per session. This knob was INERT until 2026-08-31 - the strategy's
# position flag never cleared intraday, so it took one trade a day whatever the
# value, which also made the backtest look like a 120-trade strategy when the
# rules describe a 168-trade one. With the flag fixed, the second entry of a day
# measures -6.76 bps on 44 trades at t = -2.28 (18% win, PF 0.43), negative in
# both windows. A second entry only happens after the first was stopped out,
# i.e. after the session has already shown its levels are not holding.
max_entries_per_symbol = 1
max_entries_per_level = 2

allow_short = true

# Option leg, mirrored by cmd/optbt flags in backtest.
target_delta = 0.80
target_delta_near_expiry = 0.90
# 0, not Donchian's 2. Donchian's -1571 bps expiry-day figure was measured at
# 0.75 delta, where the expiry-morning strike is nearly worthless. On this trade
# list at 0.80 delta, DTE 0 is the BEST bucket (+711 net premium bps on 12
# trades) while DTE 1-3 are negative, so skipping expiry week would cut the good
# bucket and keep the bad ones. Twelve trades a bucket is noise - the reading is
# that the skip is not justified here, not that expiry day is good.
min_days_to_expiry = 0
