# Zerobha Trading Bot Configuration

# Strategy to run live: orb | donchian | emacross.
strategy = "orb"
# Or several at once on one account, in priority order - replaces `strategy`
# when set. Each keeps its own section (timeframe, watchlist, entry window,
# capital cap, max_concurrent). Shared: the [risk] limits, capital, and the
# square-off. When two want the same stock or index, the one holding it keeps
# it until flat, and on the same candle the earlier one in this list wins. A
# strategy only exits and squares off its own positions.
# strategies = ["emacross", "orb"]
uptrend_only = false
# Paper trading: real market data and real quotes, simulated fills against
# virtual capital. The paper broker holds the stop and target itself, so
# positions exit on the same rules they would live. Also settable with -paper.
# Note the usual convention here: paper_capital = 0 means "absent" and gets
# the default below, not a zero-capital account.
paper_trading = false
paper_capital = 1000000.0
# Full bid-ask assumed on option fills in paper mode, in ticks (Rs0.05); half
# is paid each way. The emacross/donchian option verdicts were measured at 20.
paper_option_spread_ticks = 20

# Zerodha API Credentials.
# These are bare keys: they MUST stay above the first [section] header, or TOML
# assigns them to that section and the config fails to load.
api_key = ""
api_secret = ""
# Optional: log in without a browser. Your Zerodha user id, password, and the
# base32 TOTP key shown when you set up an authenticator app (Kite > My
# profile > Password & Security > 2FA). Set all three or none; empty keeps the
# login-URL flow. The Connect app must have been authorised once by hand.
# KITE_USER_ID / KITE_PASSWORD / KITE_TOTP_SECRET in the environment override.
kite_user_id = ""
kite_password = ""
kite_totp_secret = ""

# Upstox read-only access token, used by cmd/optbt for expired option candles.
# Long-lived (~1 year) and unrelated to the Kite credentials above. Bare key —
# same placement rule.
upstox_access_token = ""

[paths]
# Where the trader writes. Both are relative to the working directory: the repo
# root for a local run, /app in the container. Missing directories are created.
#
# The two destinations are independent because they land on different Docker
# volumes. In the container set:
#
#   db_path = "data/zerobha.db"   -> /app/data, the data volume
#   log_dir = "logs"              -> /app/logs, the logs volume
#
# Keep them apart. A single WORKDIR pointing at the data volume would resolve a
# relative log_dir inside it, and the backup — which reads the logs volume —
# would silently find nothing to upload.
db_path = "zerobha.db"
log_dir = "logs"

[risk]
# INR; no new entries once the day's PnL (realised + open mark-to-market, as the
# broker reports it) is below -max_daily_loss. Size it against the position:
# at 10 NIFTY lots one 3-ATR index stop is ~Rs25k of premium, so 60000 is two
# full stops. 0 = no limit. Inert before 2026-09-12 (see CLAUDE.md).
max_daily_loss       = 60000
max_trades_per_day   = 10     # entry orders placed across all symbols
# INR, combined across every strategy. One underlying (a stock, or an index
# for option legs) may not have more than this at stake in a day: its loss so
# far + the risk of its open positions + the new trade's risk (entry to stop x
# quantity; option legs use their approximate premium stop, and a signal with
# no stop risks its whole price). A new trade is cut down
# to the budget left, or refused. 0 = no limit.
max_loss_per_stock_per_day = 0
# INR. No new entries once the month's PnL (earlier sessions' realised trades
# from the journal + today's as the broker reports it) is below this. Paper
# and live are counted separately. 0 = no limit.
max_monthly_loss     = 0
max_trades_per_stock = 0      # 0 = disabled; ORB's one_trade_per_day already caps per-symbol entries

# [allocation]
# With several strategies, each one's share of the account in percent. Once
# set it must cover every running strategy and total 100 or less. A strategy
# sizes from what is left of its own share (account = free balance + capital
# in open positions), split across its own max_concurrent slots, so one
# strategy's positions never shrink another's trades. Without it, every
# strategy sizes against the whole balance split across all free slots.
# emacross = 80
# orb      = 20

[engine]
min_balance          = 3000   # INR; skip all signals when available balance is below this
min_capital_per_trade = 30000 # INR floor allocated per open slot
max_capital_per_trade = 50000 # INR cap allocated per open slot
# Open positions across all strategies; 0 = their max_concurrent values summed.
max_concurrent       = 0
trade_cutoff_min     = 845    # minutes from midnight (845 = 14:05); no new signals after this time

[orb]
timeframe = "5m"
csv_file = "high_beta_stocks.csv"
limit = 50

# Entry window cutoff in minutes from midnight (default: 630 = 10:30 AM IST)
entry_window_end = 630

# RSI thresholds for long/short entries
rsi_long_threshold = 50.0
rsi_short_threshold = 40.0

# ADX threshold for trend confirmation
adx_threshold = 20.0

# Opening range size filter (as ATR multiples)
min_range_atr = 1.0
max_range_atr = 3.0

# Stop-loss and target as ATR multiples
sl_multiplier = 1.5
target_multiplier = 3.0

# Max simultaneous open positions
max_concurrent = 5

# Donchian intraday channel breakout on the NIFTY / SENSEX 5-minute INDEX
# chart, executed in weekly index options.
#
# The signal instrument and the traded instrument are deliberately different:
# the index says when to act, an option is what gets bought. cmd/backtest
# trades the index directly (that is what every recorded result measures);
# cmd/trader translates each signal into a contract. See CLAUDE.md.
[donchian]
timeframe = "5m"
# Backtest universe: a CSV listing the index symbols to replay, matching files
# in test/data/<timeframe>/ (nifty50_real.csv, sensex_real.csv from cmd/idxdl).
csv_file = "indices.csv"
limit = 2

# Channel over the last N completed bars, excluding the bar being evaluated.
# The close must clear it by breakout_buffer_points to count as a break.
#
# NOTE breakout_buffer_points is an ABSOLUTE points knob, so the same value
# means different things across instruments: 2 points is 0.11 ATR on NIFTY but
# 0.03 ATR on SENSEX. Set it per index rather than sharing one run.
donchian_lookback = 30
breakout_buffer_points = 2.0
atr_period = 9

use_ignition = true
ignition_atr_mult = 1.0
# Index 5-minute ATR runs 0.076-0.083% of price. The stock-sized 0.15 floor
# rejected every single bar.
min_atr_pct = 0.03

# Initial stop, then a chandelier trail from the best price reached since entry.
# The trail is the ONLY profit-taking exit: a target and BREAKEVEN+ were each
# measured repeatedly and each cost more than it saved, so both knobs are gone.
#
# sl_atr_mult was 1.3, which stopped out 82% of trades before the move
# developed while all of the profit sat in the ones that survived to run.
#
# trail_atr_mult swept 1.5-8.0 on a matched entry list (2026-08-27): tightening
# it is destructive (1.5 costs 61% of per-trade edge and takes the held-out year
# to zero), and 2.5-6.0 is a flat plateau. 3.5 tops every aggregate but the two
# indices swap places under it out of sample, so 3.0 stands.
#
# An explicit trail_atr_mult = 0 disables the trail and leaves the initial stop.
# The field is a pointer so that zero survives; as a float64 it was replaced by
# the default and the trail-free case could not be measured at all.
sl_atr_mult = 3.0
trail_atr_mult = 3.0

# Overrides [engine].max_capital_per_trade for this strategy only.
#
# The engine's cap is sized for cash equities. An index priced above it is not
# traded smaller, it is not traded AT ALL: quantity floors to zero and every
# signal vanishes, which reads as the strategy finding no setups. SENSEX at
# ~78,000 against the stock-sized 50,000 produced exactly zero trades. Raising
# the engine's cap instead would rescale ORB and gapfade, whose recorded
# results were all measured at the stock-sized value.
#
# Keep it well under the 5L the backtester funds an account with: above that,
# SimBroker refuses longs for insufficient cash and a long/short strategy
# quietly becomes short-only.
max_capital_per_trade = 450000

# --- Option execution (live only; cmd/backtest trades the index directly) ---
#
# target_delta is what gets bought to express a signal: a call for a long view,
# a put for a short. Never a sold option.
#
# A delta target is not the same as a fixed point offset. What sets delta is the
# move in units of sigma*sqrt(T), so 150 points ITM is ~0.95 delta on expiry
# morning and ~0.68 six days out.
target_delta = 0.80
# Higher delta target closer to expiry (DTE <= 3) to reduce extrinsic time value and theta bleed
target_delta_near_expiry = 0.90

# min_days_to_expiry is the most valuable knob here. As time to expiry
# collapses, the target-delta strike walks in towards spot, so on expiry day it
# buys a nearly worthless contract with enormous leverage and brutal decay per
# rupee of premium: -1571 bps per trade against -104 to +106 for the rest of
# the week. 2 skips expiry day and the day before.
#
# 0 is a meaningful value ("trade expiry day too"), so the field is a pointer
# and an explicit 0 here survives rather than being replaced by the default.
min_days_to_expiry = 2

# Optional ADX trend filter, rejecting breakouts that fire in sideways chop.
# 0 disables it. These are the measured best of a 32-cell period x threshold
# sweep (2026-08-27, 733 sessions, both indices).
#
# The value of the filter is NOT a better per-trade edge - out of sample the
# whole grid, filter off included, sits between +1.1 and +2.2 bps. It is that
# 14/15 takes 95 FEWER trades than no filter and still produces more total
# gross (+6,292 vs +6,215 bps), so the entries it removes were net-negative
# contributors paying full brokerage.
#
# Keep it mild. Tightening the gate raises the tuning window and destroys the
# held-out year: period 7 threshold 40 reads +8.91 bps in sample and -0.03 out.
adx_threshold = 15.0
adx_period = 14

# Volatility used only when the at-the-money premium cannot be read. 0 means
# "refuse to trade": picking a strike against a stale constant silently buys
# the wrong contract, and not trading is the better failure.
fallback_iv = 0.0

# Minutes from midnight IST: 570 = 09:30, 871 = 14:31, 897 = 14:57.
entry_start_min = 570
entry_cutoff_min = 871
squareoff_min = 897

risk_pct = 0.5
max_daily_loss_pct = 2.0
max_concurrent = 5
max_entries_per_symbol = 4

allow_short = true
exit_on_opposite_break = true

[emacross]
timeframe = "5m"
csv_file = "indices.csv"      # Or "ind_nifty50list.csv" for stocks
limit = 50

fast_period = 9
slow_period = 21

product_type = "MIS"          # Intraday
asset_type = "options"        # "options" or "stocks"

atr_period = 5
sl_atr_mult = 3.0             # the 3 ATR trail binds first; 2.0 measured worse
tp_atr_mult = 0               # <= 0 (or absent) disables TP; a 6 ATR target measured inert

# Exit shape (measured 2026-09-12, 733 sessions, see CLAUDE.md). The opposite
# cross is a ~1 ATR trail in disguise; off, the position runs on the chandelier
# and the next cross enters once flat. trail_atr_mult = 0 disables the trail.
exit_on_opposite_cross = false
trail_atr_mult = 3.0

# Entry filters. All measured and all left off: ADX and an entry cap remove
# good trades (the Donchian pattern), a separation floor cuts the sample 5x.
min_sep_atr = 0
adx_threshold = 0
adx_period = 14
max_entries_per_symbol = 0

# Option execution, used only by cmd/trader when asset_type = "options". The
# backtester always trades the index; price its trade list with cmd/optbt.
target_delta = 0.80
target_delta_near_expiry = 0.80  # 0 = same as target_delta
min_days_to_expiry = 1        # skip expiry day only: the one losing DTE bucket on both indices
fallback_iv = 0               # 0 = refuse to trade when the ATM premium is unreadable

entry_start_min = 600         # 10:00 IST; the first half hour is gap artefacts (-4.1 bps, t -2.1)
entry_cutoff_min = 900        # 15:00 IST
squareoff_min = 915           # 15:15 IST

risk_pct = 2.0
max_capital_per_trade = 150000 # Sized for index contracts (~78k for SENSEX)
max_concurrent = 5

[telegram]
# Optional operator notifications: start-up with the effective config, the
# Kite login link, every entry and exit, risk kill switch, feed drops,
# square-off, fatal errors and an end-of-day summary. Either value empty =
# log only. TELEGRAM_TOKEN / TELEGRAM_CHAT_ID override these (same names as
# rsrankbot). Keep the real token in config.local.toml.
token = ""
chat_id = ""
